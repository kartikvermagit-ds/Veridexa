version: "3.8"

services:
  backend:
    build: .
    container_name: veridexa_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Veridexa
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/veridexa
      - LLM_PROVIDER=mock
      - UPLOAD_DIR=/app/uploads
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: veridexa_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=veridexa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
